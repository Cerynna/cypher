[package]
name = "cypher"
version = "0.1.0"
description = "Émulateur de terminal perso"
authors = ["Jeremy Martin"]
edition = "2024"

[lib]
name = "cypher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9.0"
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-dialog = "2.8.4"
notify = "8"
tauri-plugin-opener = "2.7.2"
tauri-plugin-notification = "2.8.0"
tauri-plugin-global-shortcut = "2.4.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
