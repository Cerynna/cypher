  <polyline points="64,300 64,220 220,64 300,64" fill="none" stroke="#ff2a6d" stroke-width="18" filter="url(#glow)"/>
  <polyline points="960,724 960,804 804,960 724,960" fill="none" stroke="#00e1ff" stroke-width="18" filter="url(#glow)"/>
  <polyline points="284,318 500,512 284,706" fill="none" stroke="#ff2a6d" stroke-width="96" stroke-linecap="square" opacity="0.85" transform="translate(-18 6)"/>
