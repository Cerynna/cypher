name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      plateforme:
        description: Plateforme à construire
        type: choice
        default: all
        options: [all, windows, linux, macos]

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@v4

      - name: Notes de version depuis CHANGELOG.md
        id: notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes=$(awk -v heading="## [$version]" '/^## /{inside = index($0, heading) == 1; next} inside' CHANGELOG.md)
          if [ -z "$(tr -d '[:space:]' <<<"$notes")" ]; then
            echo "::error::Aucune section [$version] dans CHANGELOG.md"
            exit 1
          fi
          {
            echo "notes<<CHANGELOG_EOF"
            echo "$notes"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - id: select
        env:
          PLATEFORME: ${{ inputs.plateforme || 'all' }}
        run: |
          targets='[
            {"key": "windows", "name": "Windows (.exe)", "platform": "windows-latest", "args": "--bundles nsis", "rust-targets": ""},
            {"key": "linux", "name": "Linux (.deb)", "platform": "ubuntu-22.04", "args": "--bundles deb", "rust-targets": ""},
            {"key": "macos", "name": "macOS (.dmg)", "platform": "macos-latest", "args": "--bundles app,dmg --target universal-apple-darwin", "rust-targets": "aarch64-apple-darwin,x86_64-apple-darwin"}
          ]'
          selected=$(jq -c --arg p "$PLATEFORME" 'map(select($p == "all" or .key == $p))' <<<"$targets")
          echo "matrix={\"include\":$selected}" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Le tag correspond à la version de package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Le tag $GITHUB_REF_NAME ne correspond pas à la version $version de package.json"
            exit 1
          fi

      - name: Dépendances système Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libwebkit2gtk-4.1-dev libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}

      - name: Installation front
        run: yarn install --frozen-lockfile

      - name: Build et release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: CYPHER ${{ github.ref_name }}
          releaseBody: |
            ${{ needs.plan.outputs.notes }}

            ---
            Installeurs non signés :
            - Windows : SmartScreen affiche un avertissement, « Informations complémentaires » puis « Exécuter quand même ».
            - macOS : si l'app est déclarée « endommagée », lancer `xattr -cr /Applications/CYPHER.app`.
          releaseDraft: true
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      - name: Artefacts du build manuel
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: cypher-${{ runner.os }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
