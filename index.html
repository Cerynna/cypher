<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CYPHER</title>
    <script type="module" src="/src/main.ts"></script>
  </head>

  <body>
    <div class="frame" data-tabs="top">
      <header class="hud" data-tauri-drag-region="deep">
        <span class="hud__brand" data-text="CYPHER" aria-hidden="true">CYPHER</span>
        <span class="hud__divider" aria-hidden="true">//</span>
        <div class="dock">
          <nav class="dock__tabs" aria-label="Onglets"></nav>
          <div class="dock__commands" role="toolbar" aria-label="Commandes rapides"></div>
        </div>
        <span class="hud__pulse" aria-hidden="true"></span>
        <nav class="hud__controls" aria-label="Fenêtre">
          <button class="hud__control hud__control--app" data-action="splitRight" aria-label="Diviser à droite">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="1" /><path d="M12 4v16" /></svg>
          </button>
          <button class="hud__control hud__control--app" data-action="splitDown" aria-label="Diviser en bas">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="1" /><path d="M3 12h18" /></svg>
          </button>
          <button class="hud__control hud__control--app" data-action="toggleClipboardHistory" aria-label="Historique du presse-papiers">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="1" /><path d="M9 4V2.5h6V4M8.5 10h7M8.5 14h7M8.5 18h4" /></svg>
          </button>
          <button class="hud__control hud__control--app" data-action="settings" aria-label="Réglages">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="3" />
              <circle cx="12" cy="12" r="7" />
              <path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1" />
            </svg>
          </button>
          <button class="hud__control" data-window-action="minimize" aria-label="Réduire">─</button>
          <button class="hud__control" data-window-action="maximize" aria-label="Agrandir">□</button>
          <button class="hud__control hud__control--close" data-window-action="close" aria-label="Fermer">✕</button>
        </nav>
      </header>
      <div class="frame__body">
        <div class="frame__main">
          <main id="workspace"></main>
        </div>
      </div>
    </div>
    <div class="scanlines" aria-hidden="true"></div>
    <div id="search-bar" hidden>
      <span class="search-bar__label">SCAN</span>
      <input type="search" placeholder="motif…" aria-label="Rechercher dans le terminal" />
    </div>
  </body>
</html>
